# Host definitions shared by every scenario's compose.yml (via `extends`).
#
#   network "linuxlab" 10.77.0.0/24
#   ├── lnx-srv     10.77.0.10   the broken server (systemd, nginx, sshd, cron, rsyslog)
#   ├── lnx-client  10.77.0.20   a second machine (CI runner / API host / browser)
#   └── lnx-dns     10.77.0.53   dnsmasq for *.internal / *.lab names
#
# Safety: NOT privileged. No host devices, read-only /proc/sys and /sys, own
# cgroup namespace. Only the capabilities the scenarios need are added.
x-host: &host
  image: linuxlab/server:1
  pull_policy: never
  cgroup: private
  tmpfs: [/run, /run/lock]
  cap_add: [SYS_ADMIN, NET_ADMIN, SYS_PTRACE, LINUX_IMMUTABLE]
  security_opt: [seccomp=unconfined, apparmor=unconfined]
  stop_grace_period: 5s
  dns: [10.77.0.53]
  cpus: 2
  mem_limit: 1g

services:
  srv:
    <<: *host
    container_name: lnx-srv
    hostname: srv
    networks: { lab: { ipv4_address: 10.77.0.10 } }

  client:
    <<: *host
    container_name: lnx-client
    hostname: client
    cpus: 1
    mem_limit: 512m
    extra_hosts: ["srv.lab:10.77.0.10"]
    networks: { lab: { ipv4_address: 10.77.0.20 } }

  dns:
    image: linuxlab/server:1
    pull_policy: never
    container_name: lnx-dns
    hostname: dns
    cap_add: [NET_ADMIN]
    command: ["dnsmasq", "-k", "--no-hosts", "--no-resolv", "--server=127.0.0.11",
              "--address=/api.internal/10.77.0.20", "--address=/srv.lab/10.77.0.10",
              "--log-queries", "--log-facility=-"]
    networks: { lab: { ipv4_address: 10.77.0.53 } }
