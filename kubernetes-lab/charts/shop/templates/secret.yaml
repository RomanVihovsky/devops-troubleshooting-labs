{{- $s := .Values.secret }}
{{- if not (has $s.source (list "inline" "existingSecret" "sealedSecret" "externalSecret")) }}
{{- fail (printf "secret.source must be inline, existingSecret, sealedSecret or externalSecret (got %q)" $s.source) }}
{{- end }}
{{- if eq $s.source "inline" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.name }}
  labels:
    {{- include "shop.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $s.inline }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- else if eq $s.source "sealedSecret" }}
{{- $ss := $s.sealedSecret }}
{{- if not $ss.encryptedData }}{{ fail "secret.source=sealedSecret needs secret.sealedSecret.encryptedData" }}{{ end }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $s.name }}
  labels:
    {{- include "shop.labels" . | nindent 4 }}
  {{- if ne $ss.scope "strict" }}
  annotations:
    sealedsecrets.bitnami.com/{{ $ss.scope }}: "true"
  {{- end }}
spec:
  encryptedData:
    {{- toYaml $ss.encryptedData | nindent 4 }}
  template:
    type: Opaque
    metadata:
      name: {{ $s.name }}
      labels:
        {{- include "shop.labels" . | nindent 8 }}
      {{- if ne $ss.scope "strict" }}
      annotations:
        sealedsecrets.bitnami.com/{{ $ss.scope }}: "true"
      {{- end }}
{{- else if eq $s.source "externalSecret" }}
{{- $es := $s.externalSecret }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $s.name }}
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeRef.kind }}
    name: {{ $es.storeRef.name }}
  target:
    name: {{ $s.name }}
    creationPolicy: {{ $es.creationPolicy }}
  data:
    {{- range $key, $ref := $es.data }}
    - secretKey: {{ $key }}
      remoteRef:
        {{- if kindIs "string" $ref }}
        key: {{ $es.remoteKey }}
        property: {{ $ref }}
        {{- else }}
        key: {{ $ref.key | default $es.remoteKey }}
        {{- with $ref.property }}
        property: {{ . }}
        {{- end }}
        {{- end }}
    {{- end }}
{{- end }}
