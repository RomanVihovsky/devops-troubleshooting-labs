nameOverride: ""
fullnameOverride: ""

image:
  repository: registry.lab:5000/lab/redis
  tag: 7-alpine
  pullPolicy: IfNotPresent

port: 6379
auth:
  enabled: true                       # --requirepass from the Secret below
  existingSecret: ""                  # required when auth.enabled
  secretKey: redis-password
extraArgs: []                         # appended to redis-server, e.g. [--maxmemory, 64mb]

resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {memory: 128Mi}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 999                      # redis in the alpine image
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

service:
  type: ClusterIP
  port: 6379

enableServiceLinks: true
podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
