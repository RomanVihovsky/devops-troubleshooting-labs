apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "labapp.fullname" . }}
  labels:
    {{- include "labapp.labels" . | nindent 4 }}
data:
  {{- include "labapp.settings" . | trim | nindent 2 }}
{{- if .Values.config.file.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "labapp.fullname" . }}-files
  labels:
    {{- include "labapp.labels" . | nindent 4 }}
data:
  {{ .Values.config.file.name }}: |
    {{- .Values.config.file.content | nindent 4 }}
{{- end }}
