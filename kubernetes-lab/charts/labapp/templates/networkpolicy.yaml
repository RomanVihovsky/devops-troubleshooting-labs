{{- if .Values.networkPolicy.enabled }}
{{- $in := .Values.networkPolicy.ingress }}
{{- $out := .Values.networkPolicy.egress }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "labapp.fullname" . }}
  labels:
    {{- include "labapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "labapp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $out.restrict }}
    - Egress
    {{- end }}
  {{- if or $in.allowSameNamespace $in.ingressControllerNamespace $in.from }}
  ingress:
    - from:
        {{- if $in.allowSameNamespace }}
        - podSelector: {}
        {{- end }}
        {{- with $in.ingressControllerNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        {{- with $in.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
  {{- if $out.restrict }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $out.dnsNamespace }}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with $out.to }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
