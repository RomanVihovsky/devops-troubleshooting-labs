{{- /* Secret sources. existingSecret renders nothing: the Secret is created outside this chart. */}}
{{- $s := .Values.secrets }}
{{- if eq $s.source "sealedSecret" }}
{{- $ss := $s.sealedSecret }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "labapp.secretName" . }}
  labels:
    {{- include "labapp.labels" . | nindent 4 }}
  {{- if or (ne $ss.scope "strict") $ss.annotations }}
  annotations:
    {{- if eq $ss.scope "namespace-wide" }}
    sealedsecrets.bitnami.com/namespace-wide: "true"
    {{- else if eq $ss.scope "cluster-wide" }}
    sealedsecrets.bitnami.com/cluster-wide: "true"
    {{- end }}
    {{- with $ss.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  encryptedData:
    {{- toYaml $ss.encryptedData | nindent 4 }}
  template:
    type: {{ $ss.type }}
    metadata:
      name: {{ include "labapp.secretName" . }}
      labels:
        {{- include "labapp.labels" . | nindent 8 }}
        {{- with $ss.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if ne $ss.scope "strict" }}
      annotations:
        sealedsecrets.bitnami.com/{{ $ss.scope }}: "true"
      {{- end }}
{{- else if eq $s.source "externalSecret" }}
{{- $es := $s.externalSecret }}
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "labapp.secretName" . }}
  labels:
    {{- include "labapp.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.storeRef.kind }}
    name: {{ $es.storeRef.name }}
  target:
    name: {{ include "labapp.secretName" . }}
    creationPolicy: {{ $es.creationPolicy }}
    {{- with $es.template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with $es.data }}
  data:
    {{- range $key, $ref := . }}
    - secretKey: {{ $key }}
      remoteRef:
        {{- if kindIs "string" $ref }}
        key: {{ required (printf "secrets.externalSecret.remoteKey is needed for %q" $key) $es.remoteKey }}
        property: {{ $ref }}
        {{- else }}
        key: {{ $ref.key | default $es.remoteKey | required (printf "no remote key for %q" $key) }}
        {{- with $ref.property }}
        property: {{ . }}
        {{- end }}
        {{- with $ref.version }}
        version: {{ . | quote }}
        {{- end }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- with $es.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
