apiVersion: v1
kind: Service
metadata:
  name: {{ include "labapp.fullname" . }}
  labels:
    {{- include "labapp.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and .Values.service.externalTrafficPolicy (has .Values.service.type (list "NodePort" "LoadBalancer")) }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "labapp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      {{- if and .Values.service.nodePort (has .Values.service.type (list "NodePort" "LoadBalancer")) }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
{{- if include "labapp.headlessEnabled" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "labapp.headlessName" . }}
  labels:
    {{- include "labapp.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: {{ .Values.headless.publishNotReadyAddresses }}
  selector:
    {{- include "labapp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.app.port }}
      targetPort: http
      protocol: TCP
{{- end }}
