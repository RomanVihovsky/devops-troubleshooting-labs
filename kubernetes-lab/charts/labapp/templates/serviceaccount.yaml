{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "labapp.serviceAccountName" . }}
  labels:
    {{- include "labapp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
{{- if and .Values.rbac.create (eq .Values.app.peers.discovery "kubernetes") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "labapp.fullname" . }}-pod-reader
  labels:
    {{- include "labapp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "labapp.fullname" . }}-pod-reader
  labels:
    {{- include "labapp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "labapp.fullname" . }}-pod-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "labapp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and .Values.rbac.create .Values.app.credentialsSecret (not (contains "/" .Values.app.credentialsSecret)) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "labapp.fullname" . }}-secret-reader
  labels:
    {{- include "labapp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.app.credentialsSecret | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "labapp.fullname" . }}-secret-reader
  labels:
    {{- include "labapp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "labapp.fullname" . }}-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "labapp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
