# ExternalSecret from the openbao ClusterSecretStore (string + object remoteRefs)
secrets:
  source: externalSecret
  env:
    REDIS_PASSWORD: redis-password
    AUTH_TOKEN: api-token
  externalSecret:
    remoteKey: labapp/demo
    data:
      redis-password: redis_password
      api-token: {key: shared/tokens, property: api}
    creationPolicy: Owner
app:
  redis: {host: redis, port: 6379}
