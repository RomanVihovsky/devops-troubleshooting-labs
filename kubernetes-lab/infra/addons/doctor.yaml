# ./lab cluster doctor - throwaway workloads that exercise the whole stack (namespace deleted afterwards).
# @AGNHOST@ / @BUSYBOX@ are filled in from versions.env.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-doctor
---
# agnhost netexec on every node, control plane included: pod matrix, Service, NodePort, Ingress, HTTPRoute
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: echo
  namespace: lab-doctor
spec:
  selector:
    matchLabels: {app: echo}
  template:
    metadata:
      labels: {app: echo}
    spec:
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      terminationGracePeriodSeconds: 2
      containers:
        - name: echo
          image: @AGNHOST@
          args: [netexec, --http-port=8080]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /hostname, port: http}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: lab-doctor
spec:
  selector: {app: echo}
  ports:
    - {port: 80, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: echo-nodeport
  namespace: lab-doctor
spec:
  type: NodePort
  selector: {app: echo}
  ports:
    - {port: 80, targetPort: http, nodePort: 30999}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
  namespace: lab-doctor
spec:
  rules:
    - host: doctor.lab
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: echo, port: {number: 80}}}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: lab-doctor
spec:
  parentRefs:
    - {name: traefik-gateway, namespace: traefik}
  hostnames: [doctor-gw.lab]
  rules:
    - backendRefs:
        - {name: echo, port: 80}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared
  namespace: lab-doctor
spec:
  storageClassName: nfs
  accessModes: [ReadWriteMany]
  resources:
    requests: {storage: 64Mi}
---
# two writers on different nodes share the RWX volume; each writes its node name, doctor reads both files
apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
  namespace: lab-doctor
spec:
  replicas: 2
  selector:
    matchLabels: {app: writer}
  template:
    metadata:
      labels: {app: writer}
    spec:
      terminationGracePeriodSeconds: 1
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: writer}}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: writer
          image: @BUSYBOX@
          command: [sh, -c, 'echo "$NODE" > "/data/$NODE" && sleep 3600']
          env:
            - name: NODE
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: shared}
