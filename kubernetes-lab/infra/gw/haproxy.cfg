# haproxy on k8s-gw: the cluster's API endpoint k8s-api.lab:6443 (kubeadm controlPlaneEndpoint)
global
    log /dev/log local0
    maxconn 2000
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  1h
    timeout server  1h

frontend k8s-api
    bind :6443
    default_backend k8s-control-plane

backend k8s-control-plane
    option httpchk GET /readyz
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 check check-ssl verify none
    server k8s-cp1 192.168.56.21:6443
    # HA later: server k8s-cp2 192.168.56.22:6443 / k8s-cp3 192.168.56.23:6443

frontend stats
    mode http
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
