# Baseline lab cluster: 1 control plane + 3 workers in two "zones"
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
networking:
  apiServerAddress: "0.0.0.0"     # reachable from the desktop VM over the host-only network
  apiServerPort: 6443
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 80 }
      - { containerPort: 30443, hostPort: 443 }
  - role: worker
    labels: { topology.kubernetes.io/zone: zone-a }
  - role: worker
    labels: { topology.kubernetes.io/zone: zone-a }
  - role: worker
    labels: { topology.kubernetes.io/zone: zone-b }
