# The root Application (app-of-apps): everything under apps/ in lab/gitops
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://git.lab:3000/lab/gitops.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
