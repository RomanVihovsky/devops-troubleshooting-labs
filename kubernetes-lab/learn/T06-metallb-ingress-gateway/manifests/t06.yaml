apiVersion: apps/v1
kind: Deployment
metadata: {name: hello, namespace: t06}
spec:
  replicas: 2
  selector: {matchLabels: {app: hello}}
  template:
    metadata: {labels: {app: hello}}
    spec:
      containers:
        - name: app
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: APP_NAME, value: t06-hello}]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: hello, namespace: t06}
spec:
  selector: {app: hello}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: hello-lb
  namespace: t06
  # TODO: ask MetalLB for 192.168.56.210
spec:
  type: ClusterIP                       # TODO
  selector: {app: hello}
  ports: [{name: http, port: 80, targetPort: http}]
---
# TODO: Ingress hello (host t06.lab -> Service hello:80)
---
