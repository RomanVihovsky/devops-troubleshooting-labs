apiVersion: v1
kind: ServiceAccount
metadata: {name: t13-reader, namespace: t13}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: openbao, namespace: t13}
spec:
  provider:
    vault:
      server: https://bao.lab:8200
      path: secret
      version: v2
      # TODO: trust the lab CA from the ConfigMap lab-ca (key ca.crt)
      auth:
        kubernetes:
          mountPath: kubernetes
          role: TODO
          serviceAccountRef: {name: TODO, audiences: [openbao]}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: db-creds, namespace: t13}
spec:
  refreshInterval: 15s
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: db-creds}
  data:
    # TODO: username and password from secret/t13/db
