apiVersion: v1
kind: Pod
metadata: {name: reader, namespace: t05}
spec:
  containers:
    - name: r
      image: docker.io/library/busybox:1.37
      command: [sh, -c, 'sleep 86400']
      volumeMounts: [{name: data, mountPath: /data}]
  volumes:
    - {name: data, persistentVolumeClaim: {claimName: restored}}
