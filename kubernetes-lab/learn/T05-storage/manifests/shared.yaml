# step 3: one NFS volume, written from two nodes
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: shared, namespace: t05}
spec:
  accessModes: [TODO]                 # every pod on every node may write
  storageClassName: TODO
  resources: {requests: {storage: 64Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: writers, namespace: t05}
spec:
  replicas: 2
  selector: {matchLabels: {app: writers}}
  template:
    metadata: {labels: {app: writers}}
    spec:
      # TODO: the two replicas must land on two different nodes
      containers:
        - name: w
          image: docker.io/library/busybox:1.37
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          command: [sh, -c, 'while true; do echo "$NODE_NAME $(date +%s)" >> /data/log; sleep 5; done']
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: shared}}
