# prod's own SecretStore: OpenBao kubernetes auth as ServiceAccount eso-reader (role prod)
apiVersion: v1
kind: ServiceAccount
metadata: {name: eso-reader, namespace: prod}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: openbao, namespace: prod}
spec:
  provider:
    vault:
      server: https://bao.lab:8200
      path: secret
      version: v2
      caProvider: {type: ConfigMap, name: lab-ca, key: ca.crt}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: prod
          serviceAccountRef: {name: eso-reader, audiences: [openbao]}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: app-secrets, namespace: prod}
spec:
  refreshInterval: 30s
  secretStoreRef: {kind: SecretStore, name: openbao}
  target: {name: app-secrets}
  data:
    - secretKey: api_key
      remoteRef: {key: prod/app, property: api_key}
