apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger, namespace: ledger}
spec:
  replicas: 2
  selector: {matchLabels: {app: ledger}}
  template:
    metadata: {labels: {app: ledger}}
    spec:
      containers:
        - name: ledger
          image: registry.lab:5000/lab/labapp:1.4
          env:
            - {name: APP_NAME, value: ledger}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: ledger-db, key: password}}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
