apiVersion: policy/v1beta1
kind: PodDisruptionBudget
metadata: {name: web, namespace: legacyweb}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: web}}
---
apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata: {name: web, namespace: legacyweb}
spec:
  rules:
    - host: legacy.lab
      http:
        paths:
          - path: /
            backend: {serviceName: web, servicePort: 8080}
