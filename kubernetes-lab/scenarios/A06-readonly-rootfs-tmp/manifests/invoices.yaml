apiVersion: apps/v1
kind: Deployment
metadata: {name: invoices, namespace: invoices}
spec:
  replicas: 2
  selector: {matchLabels: {app: invoices}}
  template:
    metadata: {labels: {app: invoices}}
    spec:
      containers:
        - name: app
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: APP_NAME, value: invoices}]
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
