apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog, namespace: catalog2}
spec:
  replicas: 2
  selector: {matchLabels: {app: catalog}}
  template:
    metadata: {labels: {app: catalog}}
    spec:
      containers:
        - name: catalog
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: APP_NAME, value: catalog}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: catalog, namespace: catalog2}
spec: {selector: {app: catalog}, ports: [{name: http, port: 8080, targetPort: 8080}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: catalog, namespace: catalog2}
spec:
  rules:
    - host: catalog.lab
      http:
        paths: [{path: /, pathType: Prefix, backend: {service: {name: catalog, port: {number: 80}}}}]
