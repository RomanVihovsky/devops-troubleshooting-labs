apiVersion: apps/v1
kind: StatefulSet
metadata: {name: tsdb, namespace: metrics}
spec:
  serviceName: tsdb
  replicas: 2
  selector: {matchLabels: {app: tsdb}}
  template:
    metadata: {labels: {app: tsdb}}
    spec:
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}   # NFS (--manage-gids): the group must be primary
      containers:
        - name: tsdb
          image: registry.lab:5000/lab/labapp:1.4
          env:
            - {name: APP_NAME, value: tsdb}
            - {name: DATA_DIR, value: /data}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: nfs
        resources:
          requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata: {name: tsdb, namespace: metrics}
spec:
  clusterIP: None
  selector: {app: tsdb}
  ports: [{port: 8080}]
