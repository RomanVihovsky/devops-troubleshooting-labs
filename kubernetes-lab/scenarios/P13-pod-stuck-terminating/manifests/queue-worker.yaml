apiVersion: apps/v1
kind: Deployment
metadata: {name: queue-worker, namespace: queue}
spec:
  replicas: 1
  selector: {matchLabels: {app: queue-worker}}
  template:
    metadata: {labels: {app: queue-worker}}
    spec:
      terminationGracePeriodSeconds: 600
      containers:
        - name: worker
          image: registry.lab:5000/lab/labapp:1.4
          env:
            - {name: APP_NAME, value: queue-worker}
            - {name: SHUTDOWN_MODE, value: ignore}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
