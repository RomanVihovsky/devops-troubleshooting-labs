apiVersion: apps/v1
kind: Deployment
metadata: {name: store, namespace: store}
spec:
  replicas: 2
  selector: {matchLabels: {app: store}}
  template:
    metadata: {labels: {app: store}}
    spec:
      containers:
        - name: store
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: APP_NAME, value: store}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: store, namespace: store}
spec: {selector: {app: store}, ports: [{name: http, port: 8080, targetPort: 8080}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: store, namespace: store}
spec:
  rules:
    - host: store.lab
      http:
        paths: [{path: /, pathType: Prefix, backend: {service: {name: store, port: {number: 8080}}}}]
