apiVersion: v1
kind: Service
metadata: {name: search, namespace: frontend}
spec:
  type: ExternalName
  externalName: search.vendor.svc.cluster.local
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: frontend}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: web
          image: registry.lab:5000/lab/labapp:1.4
          env:
            - {name: APP_NAME, value: frontend}
            - {name: UPSTREAM_URL, value: "https://search:8443/items"}
            - {name: UPSTREAM_CA_FILE, value: /etc/lab-ca/ca.crt}
            - {name: UPSTREAM_REQUIRED, value: "true"}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
          volumeMounts: [{name: lab-ca, mountPath: /etc/lab-ca, readOnly: true}]
      volumes:
        - name: lab-ca
          configMap: {name: lab-ca}
