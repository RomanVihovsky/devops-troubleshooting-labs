apiVersion: v1
kind: ConfigMap
metadata: {name: promo-config, namespace: promo}
data:
  GREETING: Hello
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: promo, namespace: promo}
spec:
  replicas: 2
  selector: {matchLabels: {app: promo}}
  template:
    metadata: {labels: {app: promo}}
    spec:
      containers:
        - name: promo
          image: registry.lab:5000/lab/labapp:1.4
          envFrom: [{configMapRef: {name: promo-config}}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
