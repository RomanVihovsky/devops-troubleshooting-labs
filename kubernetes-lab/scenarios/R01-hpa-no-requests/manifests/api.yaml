apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: hpa}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: HASH_ITERATIONS, value: "20000"}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: hpa}
spec: {selector: {app: api}, ports: [{port: 8080}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api, namespace: hpa}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
