apiVersion: apps/v1
kind: Deployment
metadata: {name: image-scanner, namespace: scanner}
spec:
  replicas: 2
  selector: {matchLabels: {app: image-scanner}}
  template:
    metadata: {labels: {app: image-scanner}}
    spec:
      containers:
        - name: scanner
          image: registry.lab:5000/lab/labapp:1.4
          env:
            - {name: APP_NAME, value: image-scanner}
            - {name: UPSTREAM_URL, value: "http://registry.lab:5000/v2/"}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
          resources: {requests: {cpu: 20m, memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: image-scanner, namespace: scanner}
spec:
  selector: {app: image-scanner}
  ports: [{port: 8080, targetPort: 8080}]
