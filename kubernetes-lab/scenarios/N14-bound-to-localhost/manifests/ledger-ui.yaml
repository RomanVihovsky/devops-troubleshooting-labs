apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger-ui, namespace: ledger-ui}
spec:
  replicas: 2
  selector: {matchLabels: {app: ledger-ui}}
  template:
    metadata: {labels: {app: ledger-ui}}
    spec:
      containers:
        - name: ui
          image: registry.lab:5000/lab/labapp:1.4
          env:
            - {name: APP_NAME, value: ledger-ui}
            - {name: BIND_ADDRESS, value: 127.0.0.1}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {exec: {command: [labapp, get, http://127.0.0.1:8080/ready, -q]}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: ledger-ui, namespace: ledger-ui}
spec:
  selector: {app: ledger-ui}
  ports: [{name: http, port: 80, targetPort: http}]
