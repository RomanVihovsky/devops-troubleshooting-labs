apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: web-prod}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      imagePullSecrets: [{name: regcred}]
      containers:
        - name: web
          image: registry.lab:5001/lab/labapp:1.6      # staging: the ARM build
          envFrom: [{configMapRef: {name: web-config}}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: web-prod}
spec:
  selector: {app: web}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: web, namespace: web-prod}
spec:
  ingressClassName: nginx
  rules:
    - host: web.prod.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: web, port: {number: 8080}}}
