apiVersion: apps/v1
kind: Deployment
metadata: {name: notify, namespace: notify}
spec:
  replicas: 2
  selector: {matchLabels: {app: notify}}
  template:
    metadata: {labels: {app: notify}}
    spec:
      containers:
        - {name: notify, image: registry.lab:5000/lab/labapp:1.4, env: [{name: APP_NAME, value: notify}]}
