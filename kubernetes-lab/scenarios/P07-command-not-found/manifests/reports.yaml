apiVersion: apps/v1
kind: Deployment
metadata: {name: reports, namespace: reports}
spec:
  replicas: 2
  selector: {matchLabels: {app: reports}}
  template:
    metadata: {labels: {app: reports}}
    spec:
      containers:
        - name: reports
          image: registry.lab:5000/lab/labapp:1.4
          command: [gunicorn, --workers, "4", "app:app"]
          env: [{name: APP_NAME, value: reports}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
