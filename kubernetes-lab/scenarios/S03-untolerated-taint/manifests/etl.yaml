apiVersion: apps/v1
kind: Deployment
metadata: {name: etl, namespace: etl}
spec:
  replicas: 2
  selector: {matchLabels: {app: etl}}
  template:
    metadata: {labels: {app: etl}}
    spec:
      containers:
        - {name: etl, image: registry.lab:5000/lab/labapp:1.4, env: [{name: APP_NAME, value: etl}]}
