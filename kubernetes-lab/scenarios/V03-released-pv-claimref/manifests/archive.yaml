apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: archive, namespace: archive}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: orders-archive
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Pod
metadata: {name: reader, namespace: archive}
spec:
  containers:
    - {name: r, image: docker.io/library/busybox:1.37, command: [sh, -c, 'sleep 86400'], volumeMounts: [{name: data, mountPath: /data}]}
  volumes: [{name: data, persistentVolumeClaim: {claimName: archive}}]
