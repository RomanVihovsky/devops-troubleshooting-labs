apiVersion: apps/v1
kind: Deployment
metadata: {name: pod-policy, namespace: policy-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: pod-policy}}
  template:
    metadata: {labels: {app: pod-policy}}
    spec:
      containers:
        - name: webhook
          image: registry.lab:5000/lab/labapp:1.7
          args: ["webhook"]
          env:
            - {name: TLS_CERT_FILE, value: /tls/tls.crt}
            - {name: TLS_KEY_FILE, value: /tls/tls.key}
            - {name: WEBHOOK_MODE, value: validate}
            - {name: WEBHOOK_DENY_LABEL, value: "policy.lab/deny=true"}
            - {name: WEBHOOK_DENY_MESSAGE, value: "objects labelled policy.lab/deny=true are not allowed in this namespace"}
          ports: [{containerPort: 8443}]
          readinessProbe:                   # added in PLAT-311 "health checks for everything"
            httpGet: {path: /healthz, port: 8443}
            periodSeconds: 5
          volumeMounts: [{name: tls, mountPath: /tls, readOnly: true}]
      volumes:
        - name: tls
          secret: {secretName: pod-policy-tls}
---
apiVersion: v1
kind: Service
metadata: {name: pod-policy, namespace: policy-system}
spec:
  selector: {app: pod-policy}
  ports: [{port: 443, targetPort: 8443}]
