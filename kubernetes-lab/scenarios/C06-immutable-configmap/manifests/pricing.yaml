apiVersion: v1
kind: ConfigMap
metadata: {name: pricing-config, namespace: pricing}
immutable: true
data:
  CURRENCY: EUR
  APP_NAME: pricing
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pricing, namespace: pricing}
spec:
  replicas: 2
  selector: {matchLabels: {app: pricing}}
  template:
    metadata: {labels: {app: pricing}}
    spec:
      containers:
        - name: pricing
          image: registry.lab:5000/lab/labapp:1.4
          envFrom: [{configMapRef: {name: pricing-config}}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
