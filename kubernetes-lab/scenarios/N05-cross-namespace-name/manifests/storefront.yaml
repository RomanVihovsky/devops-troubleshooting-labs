apiVersion: apps/v1
kind: Deployment
metadata: {name: storefront, namespace: storefront}
spec:
  replicas: 1
  selector: {matchLabels: {app: storefront}}
  template:
    metadata: {labels: {app: storefront}}
    spec:
      containers:
        - name: web
          image: registry.lab:5000/lab/labapp:1.4
          env:
            - {name: APP_NAME, value: storefront}
            - {name: UPSTREAM_URL, value: http://api/items}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: storefront, namespace: storefront}
spec:
  selector: {app: storefront}
  ports: [{name: http, port: 80, targetPort: http}]
