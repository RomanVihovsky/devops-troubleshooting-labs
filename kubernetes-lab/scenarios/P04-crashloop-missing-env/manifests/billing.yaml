apiVersion: apps/v1
kind: Deployment
metadata: {name: billing, namespace: billing}
spec:
  replicas: 2
  selector: {matchLabels: {app: billing}}
  template:
    metadata: {labels: {app: billing}}
    spec:
      containers:
        - name: billing
          image: registry.lab:5000/lab/labapp:1.4
          env:
            - {name: APP_NAME, value: billing}
            - {name: REQUIRED_ENV, value: DATABASE_URL}
            - {name: DB_URL, value: "postgres://billing@db.billing:5432/billing"}
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 3}
