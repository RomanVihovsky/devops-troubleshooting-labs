apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog-api, namespace: catalog}
spec:
  replicas: 2
  selector: {matchLabels: {app: catalog-api}}
  template:
    metadata: {labels: {app: catalog-api}}
    spec:
      containers:
        - name: api
          image: registry.lab:5000/lab/labapp:1.4
          env:
            - {name: APP_NAME, value: catalog-api}
            - {name: HASH_ITERATIONS, value: "5000"}
            - {name: WARMUP_SECONDS, value: "10"}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 2}
          resources: {requests: {cpu: 100m, memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: catalog-api, namespace: catalog}
spec:
  selector: {app: catalog-api}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: catalog-api, namespace: catalog}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: catalog-api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 50}}
  behavior:                       # "react faster" - perf tuning ticket PERF-118
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 0
      policies:
        - {type: Percent, value: 100, periodSeconds: 15}
