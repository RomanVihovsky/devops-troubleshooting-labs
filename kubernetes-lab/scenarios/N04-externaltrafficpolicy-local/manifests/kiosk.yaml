apiVersion: apps/v1
kind: Deployment
metadata: {name: kiosk, namespace: kiosk}
spec:
  replicas: 1
  selector: {matchLabels: {app: kiosk}}
  template:
    metadata: {labels: {app: kiosk}}
    spec:
      containers:
        - name: app
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: APP_NAME, value: kiosk}]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: kiosk, namespace: kiosk}
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector: {app: kiosk}
  ports: [{name: http, port: 80, targetPort: http, nodePort: 30480}]
