apiVersion: apps/v1
kind: StatefulSet
metadata: {name: quorum, namespace: quorum}
spec:
  serviceName: quorum
  replicas: 3
  podManagementPolicy: OrderedReady
  selector: {matchLabels: {app: quorum}}
  template:
    metadata: {labels: {app: quorum}}
    spec:
      containers:
        - name: member
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: APP_NAME, value: quorum}]
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: quorum, namespace: quorum}
spec: {clusterIP: None, selector: {app: quorum}, ports: [{port: 8080}]}
