apiVersion: v1
kind: ConfigMap
metadata: {name: catalog-files, namespace: catalog}
data:
  app.conf: |
    # re-read by labapp on every request
    greeting = Hello
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog, namespace: catalog}
spec:
  replicas: 2
  selector: {matchLabels: {app: catalog}}
  template:
    metadata: {labels: {app: catalog}}
    spec:
      containers:
        - name: catalog
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: CONFIG_FILE, value: /etc/labapp/app.conf}]
          volumeMounts:
            - {name: files, mountPath: /etc/labapp/app.conf, subPath: app.conf}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
      volumes:
        - name: files
          configMap: {name: catalog-files}
