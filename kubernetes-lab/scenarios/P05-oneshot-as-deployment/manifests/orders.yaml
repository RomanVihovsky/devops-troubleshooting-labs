apiVersion: apps/v1
kind: Deployment
metadata: {name: orders, namespace: orders}
spec:
  replicas: 2
  selector: {matchLabels: {app: orders}}
  template:
    metadata: {labels: {app: orders}}
    spec:
      containers:
        - name: orders
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: APP_NAME, value: orders}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
---
# the schema migration - runs at every release
apiVersion: apps/v1
kind: Deployment
metadata: {name: orders-migrate, namespace: orders}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders-migrate}}
  template:
    metadata: {labels: {app: orders-migrate}}
    spec:
      containers:
        - name: migrate
          image: registry.lab:5000/lab/labapp:1.4
          command: [labapp, migrate]
