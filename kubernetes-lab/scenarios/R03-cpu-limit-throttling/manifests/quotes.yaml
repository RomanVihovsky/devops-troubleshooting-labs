apiVersion: apps/v1
kind: Deployment
metadata: {name: quotes, namespace: quotes}
spec:
  replicas: 2
  selector: {matchLabels: {app: quotes}}
  template:
    metadata: {labels: {app: quotes}}
    spec:
      containers:
        - name: quotes
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: HASH_ITERATIONS, value: "20000"}, {name: ACCESS_LOG, value: "false"}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 50m, memory: 256Mi}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 5, timeoutSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: quotes, namespace: quotes}
spec: {selector: {app: quotes}, ports: [{port: 8080}]}
