apiVersion: apps/v1
kind: Deployment
metadata: {name: gallery, namespace: gallery}
spec:
  replicas: 2
  selector: {matchLabels: {app: gallery}}
  template:
    metadata: {labels: {app: gallery}}
    spec:
      containers:
        - name: gallery
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: APP_NAME, value: gallery}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: gallery, namespace: gallery}
spec: {selector: {app: gallery}, ports: [{name: http, port: 8080, targetPort: 8080}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: gallery, namespace: gallery}
spec:
  ingressClassName: nginx
  rules:
    - host: gallery.lab
      http:
        paths: [{path: /, pathType: Prefix, backend: {service: {name: gallery, port: {number: 8080}}}}]
