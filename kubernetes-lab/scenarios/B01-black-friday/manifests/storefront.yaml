apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog, namespace: bf}
spec:
  replicas: 3
  selector: {matchLabels: {app: catalog}}
  template:
    metadata: {labels: {app: catalog, tier: backend}}
    spec:
      containers:
        - name: catalog
          image: registry.lab:5000/lab/labapp:1.4
          env:
            - {name: APP_NAME, value: catalog}
            - {name: HASH_ITERATIONS, value: "2000"}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
          resources:
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: catalog, namespace: bf}
spec:
  selector: {app: catalog-api}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: bf}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web, tier: frontend}}
    spec:
      containers:
        - name: web
          image: registry.lab:5000/lab/labapp:1.4
          env:
            - {name: APP_NAME, value: web}
            - {name: UPSTREAM_URL, value: "http://catalog:8080/items"}
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 3}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: bf}
spec:
  selector: {app: web}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: catalog, namespace: bf}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: catalog}
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: catalog, namespace: bf}
spec:
  minAvailable: 3
  selector: {matchLabels: {app: catalog}}
