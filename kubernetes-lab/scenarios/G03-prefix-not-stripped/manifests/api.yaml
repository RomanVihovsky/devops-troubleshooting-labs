apiVersion: apps/v1
kind: Deployment
metadata: {name: items, namespace: api-gw}
spec:
  replicas: 2
  selector: {matchLabels: {app: items}}
  template:
    metadata: {labels: {app: items}}
    spec:
      containers:
        - name: items
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: APP_NAME, value: items}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: items, namespace: api-gw}
spec: {selector: {app: items}, ports: [{name: http, port: 8080, targetPort: 8080}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: items
  namespace: api-gw
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - host: shopfront.lab
      http:
        paths: [{path: /api, pathType: Prefix, backend: {service: {name: items, port: {number: 8080}}}}]
