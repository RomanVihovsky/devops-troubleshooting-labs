apiVersion: apps/v1
kind: Deployment
metadata: {name: media, namespace: media}
spec:
  replicas: 2
  selector: {matchLabels: {app: media}}
  template:
    metadata: {labels: {app: media}}
    spec:
      containers:
        - name: media
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: APP_NAME, value: media}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: media, namespace: media}
spec: {selector: {app: media}, ports: [{name: http, port: 8080, targetPort: 8080}]}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: upload-limit, namespace: media}
spec:
  buffering: {maxRequestBodyBytes: 1048576}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: media
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: media-upload-limit@kubernetescrd
spec:
  rules:
    - host: media.lab
      http:
        paths: [{path: /, pathType: Prefix, backend: {service: {name: media, port: {number: 8080}}}}]
