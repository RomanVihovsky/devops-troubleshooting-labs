apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: market}
spec:
  replicas: 2
  selector: {matchLabels: {app: web, role: frontend}}
  template:
    metadata: {labels: {app: web, role: frontend}}
    spec:
      containers:
        - name: web
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: APP_NAME, value: web}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: market}
spec: {selector: {app: web}, ports: [{port: 80, targetPort: 8080}]}
---
# admin - copied from the web manifest
apiVersion: apps/v1
kind: Deployment
metadata: {name: admin, namespace: market}
spec:
  replicas: 2
  selector: {matchLabels: {app: web, role: admin}}
  template:
    metadata: {labels: {app: web, role: admin}}
    spec:
      containers:
        - name: admin
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: APP_NAME, value: admin}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
