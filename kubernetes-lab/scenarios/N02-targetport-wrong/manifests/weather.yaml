apiVersion: apps/v1
kind: Deployment
metadata: {name: weather, namespace: weather}
spec:
  replicas: 2
  selector: {matchLabels: {app: weather}}
  template:
    metadata: {labels: {app: weather}}
    spec:
      containers:
        - name: app
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: APP_NAME, value: weather}]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: weather, namespace: weather}
spec:
  selector: {app: weather}
  ports: [{name: http, port: 80, targetPort: 80}]
