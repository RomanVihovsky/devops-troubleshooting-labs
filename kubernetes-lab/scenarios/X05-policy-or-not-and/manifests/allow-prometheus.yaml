apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus
  namespace: db
spec:
  podSelector:
    matchLabels: {app: orders-db}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
        - podSelector:
            matchLabels: {app: prometheus}
      ports:
        - {protocol: TCP, port: 8080}
