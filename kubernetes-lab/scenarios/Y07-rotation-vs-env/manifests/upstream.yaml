# upstream: requires "Authorization: Bearer <token>", the token read from the mounted Secret on every request
apiVersion: apps/v1
kind: Deployment
metadata: {name: upstream, namespace: notify}
spec:
  replicas: 1
  selector: {matchLabels: {app: upstream}}
  template:
    metadata: {labels: {app: upstream}}
    spec:
      containers:
        - name: upstream
          image: registry.lab:5000/lab/labapp:1.4
          env:
            - {name: APP_NAME, value: upstream}
            - {name: AUTH_TOKEN_FILE, value: /etc/upstream/token}
          volumeMounts:
            - {name: token, mountPath: /etc/upstream, readOnly: true}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 5}
      volumes:
        - name: token
          secret: {secretName: api-token}
---
apiVersion: v1
kind: Service
metadata: {name: upstream, namespace: notify}
spec:
  selector: {app: upstream}
  ports: [{port: 8080, targetPort: 8080}]
