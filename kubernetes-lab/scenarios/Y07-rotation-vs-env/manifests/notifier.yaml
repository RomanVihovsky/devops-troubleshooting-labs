# notifier: calls upstream with the token from Secret api-token
apiVersion: apps/v1
kind: Deployment
metadata: {name: notifier, namespace: notify}
spec:
  replicas: 1
  selector: {matchLabels: {app: notifier}}
  template:
    metadata: {labels: {app: notifier}}
    spec:
      containers:
        - name: notifier
          image: registry.lab:5000/lab/labapp:1.4
          env:
            - {name: APP_NAME, value: notifier}
            - {name: UPSTREAM_URL, value: "http://upstream.notify.svc:8080/items"}
            - name: UPSTREAM_TOKEN
              valueFrom: {secretKeyRef: {name: api-token, key: token}}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: notifier, namespace: notify}
spec:
  selector: {app: notifier}
  ports: [{port: 8080, targetPort: 8080}]
