apiVersion: apps/v1
kind: Deployment
metadata: {name: maps, namespace: maps}
spec:
  replicas: 2
  selector: {matchLabels: {app: maps}}
  template:
    metadata: {labels: {app: maps}}
    spec:
      containers:
        - name: app
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: APP_NAME, value: maps}]
          ports: [{name: web, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /ready, port: web}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: maps, namespace: maps}
spec:
  selector: {app: maps}
  ports: [{name: http, port: 80, targetPort: http}]
