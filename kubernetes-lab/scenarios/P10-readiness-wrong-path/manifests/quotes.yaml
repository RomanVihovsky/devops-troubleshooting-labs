apiVersion: apps/v1
kind: Deployment
metadata: {name: quotes, namespace: quotes}
spec:
  replicas: 2
  selector: {matchLabels: {app: quotes}}
  template:
    metadata: {labels: {app: quotes}}
    spec:
      containers:
        - name: quotes
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: APP_NAME, value: quotes}]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: quotes, namespace: quotes}
spec:
  selector: {app: quotes}
  ports: [{name: http, port: 80, targetPort: http}]
