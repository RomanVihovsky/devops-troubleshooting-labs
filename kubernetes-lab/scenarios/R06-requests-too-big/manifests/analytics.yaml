apiVersion: apps/v1
kind: Deployment
metadata: {name: analytics, namespace: analytics2}
spec:
  replicas: 2
  selector: {matchLabels: {app: analytics}}
  template:
    metadata: {labels: {app: analytics}}
    spec:
      containers:
        - name: analytics
          image: registry.lab:5000/lab/labapp:1.4
          resources:
            requests: {cpu: 100m, memory: 6Gi}
            limits: {memory: 8Gi}
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
