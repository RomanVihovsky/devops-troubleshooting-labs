apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: archive-data, namespace: archive}
spec:
  storageClassName: nfs-standard
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: archive, namespace: archive}
spec:
  replicas: 1
  selector: {matchLabels: {app: archive}}
  template:
    metadata: {labels: {app: archive}}
    spec:
      containers:
        - name: archive
          image: registry.lab:5000/lab/labapp:1.4
          env:
            - {name: APP_NAME, value: archive}
            - {name: DATA_DIR, value: /data}
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}   # NFS (--manage-gids): the group must be primary
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: archive-data}
