apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: gateway}
spec:
  replicas: 5
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app: gateway}}}
      containers:
        - name: gateway
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: APP_NAME, value: gateway}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
