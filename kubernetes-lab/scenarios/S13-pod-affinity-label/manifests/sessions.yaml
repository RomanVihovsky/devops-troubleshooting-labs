apiVersion: apps/v1
kind: Deployment
metadata: {name: redis-cache, namespace: sessions}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis-cache}}
  template:
    metadata: {labels: {app: redis-cache}}
    spec:
      containers:
        - name: redis
          image: registry.lab:5000/lab/redis:7-alpine
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: session-api, namespace: sessions}
spec:
  replicas: 2
  selector: {matchLabels: {app: session-api}}
  template:
    metadata: {labels: {app: session-api}}
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: cache}}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: registry.lab:5000/lab/labapp:1.4
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
