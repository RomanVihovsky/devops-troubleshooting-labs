apiVersion: apps/v1
kind: Deployment
metadata: {name: search, namespace: search}
spec:
  replicas: 2
  selector: {matchLabels: {app: search, tier: web}}
  template:
    metadata: {labels: {app: search, tier: web}}
    spec:
      containers:
        - name: search
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: GREETING, value: Search v2}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: search, namespace: search}
spec: {selector: {app: search, tier: web}, ports: [{port: 80, targetPort: 8080}]}
