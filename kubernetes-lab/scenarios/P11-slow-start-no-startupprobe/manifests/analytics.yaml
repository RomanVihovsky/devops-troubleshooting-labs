apiVersion: apps/v1
kind: Deployment
metadata: {name: analytics, namespace: analytics}
spec:
  replicas: 1
  selector: {matchLabels: {app: analytics}}
  template:
    metadata: {labels: {app: analytics}}
    spec:
      containers:
        - name: analytics
          image: registry.lab:5000/lab/labapp:1.4
          env:
            - {name: APP_NAME, value: analytics}
            - {name: WARMUP_SECONDS, value: "45"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 5, failureThreshold: 3}
