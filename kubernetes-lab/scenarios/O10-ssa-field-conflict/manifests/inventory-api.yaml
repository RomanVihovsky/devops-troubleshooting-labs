apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: inventory
spec:
  replicas: 2
  selector:
    matchLabels: {app: inventory-api}
  template:
    metadata:
      labels: {app: inventory-api}
    spec:
      containers:
        - name: api
          image: registry.lab:5000/lab/labapp:1.4
          env:
            - {name: APP_NAME, value: inventory-api}
            - {name: LOG_LEVEL, value: debug}       # INV-88: bug hunt
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            periodSeconds: 3
