apiVersion: v1
kind: ConfigMap
metadata: {name: report-script, namespace: batch}
data:
  report.sh: |
    #!/bin/sh
    echo "collecting..."; sleep 2; echo "report done"
---
apiVersion: batch/v1
kind: Job
metadata: {name: nightly-report, namespace: batch}
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: report
          image: docker.io/library/busybox:1.37
          command: ["sh", "/script/report.sh"]
          volumeMounts: [{name: script, mountPath: /scripts}]
      volumes:
        - name: script
          configMap: {name: report-script}
