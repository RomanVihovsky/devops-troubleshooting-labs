apiVersion: apps/v1
kind: Deployment
metadata: {name: edge-proxy, namespace: edge}
spec:
  replicas: 2
  selector: {matchLabels: {app: edge-proxy}}
  template:
    metadata: {labels: {app: edge-proxy}}
    spec:
      containers:
        - name: proxy
          image: registry.lab:5000/lab/labapp:1.4
          env: [{name: APP_NAME, value: edge-proxy}]
          ports: [{name: http, containerPort: 8080, hostPort: 9100}]
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: edge-proxy, namespace: edge}
spec:
  selector: {app: edge-proxy}
  ports: [{name: http, port: 80, targetPort: http}]
