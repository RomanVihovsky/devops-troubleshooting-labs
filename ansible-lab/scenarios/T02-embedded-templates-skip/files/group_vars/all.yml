baseline_banner: "ACME - authorized access only"
baseline_sysctl:
  - {name: net.ipv4.tcp_syncookies, value: "1", enabled: true}
  - {name: net.ipv4.conf.all.accept_redirects, value: "0", enabled: true}
  - {name: kernel.unprivileged_bpf_disabled, value: "1", enabled: false}   # breaks the APM agent - see OPS-188
