- name: Config directory
  ansible.builtin.file:
    path: /etc/acme
    state: directory
    mode: "0755"

- name: Worker spool directories
  ansible.builtin.file:
    path: "/var/spool/acme/worker{{ item }}"
    state: directory
    mode: "0750"
  loop: "{{ range(1, workers_count + 1) }}"

- name: Worker config files
  ansible.builtin.copy:
    dest: "/etc/acme/{{ item.name }}.conf"
    content: "{{ item.content }}"
    owner: "{{ item.owner }}"
    mode: "0640"
  loop: "{{ workers_files }}"
  loop_control:
    label: "{{ item.name }}"
