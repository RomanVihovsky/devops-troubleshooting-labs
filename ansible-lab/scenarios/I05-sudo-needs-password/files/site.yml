- name: Web nodes
  hosts: web
  become: true
  tasks:
    - name: Config directory
      ansible.builtin.file:
        path: /etc/acme
        state: directory
        mode: "0755"
    - name: Hardening marker
      ansible.builtin.copy:
        dest: /etc/acme/hardened
        content: "CIS level 1\n"
        mode: "0644"
