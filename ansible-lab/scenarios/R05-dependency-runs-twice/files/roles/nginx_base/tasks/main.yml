- name: Install nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Base config
  ansible.builtin.template:
    src: 00-base.conf.j2
    dest: /etc/nginx/conf.d/00-base.conf
    mode: "0644"
  notify: Reload nginx

- name: Run nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
