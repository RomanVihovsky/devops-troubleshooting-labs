services:
  billing:
    image: registry:5000/lab/webapp:1.0
    environment:
      APP_NAME: billing
      UPSTREAM_URL: http://172.30.0.50:8080/
    ports:
      - "8080:8000"
    networks: [appnet]
    deploy:
      replicas: 2

networks:
  appnet:
    driver: overlay
    ipam:
      config:
        - subnet: 172.30.0.0/16     # standard company subnet
