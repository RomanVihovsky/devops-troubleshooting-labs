# Shop frontend + its database (redis).
services:
  web:
    image: registry:5000/lab/webapp:1.0
    environment:
      APP_NAME: shop
      REDIS_HOST: db
    ports:
      - "8080:8000"
    deploy:
      replicas: 2

  db:
    image: registry:5000/redis:7-alpine
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.disk == ssd
