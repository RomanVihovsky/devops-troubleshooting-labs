services:
  web:
    image: registry:5000/lab/webapp:1.0
    environment:
      APP_NAME: web
      GREETING_FILE: /etc/app/greeting.txt
    configs:
      - source: greeting
        target: /etc/app/greeting.txt
    ports:
      - "8080:8000"
    deploy:
      replicas: 3

configs:
  greeting:
    file: ./greeting.txt
