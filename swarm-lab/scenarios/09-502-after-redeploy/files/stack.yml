services:
  proxy:
    image: registry:5000/nginx:1.27-alpine
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    deploy:
      replicas: 1

  web:
    image: registry:5000/lab/webapp:1.0
    environment:
      APP_NAME: web
    deploy:
      replicas: 3
      endpoint_mode: dnsrr     # "faster, no IPVS hop"

configs:
  nginx_conf:
    file: ./nginx.conf
