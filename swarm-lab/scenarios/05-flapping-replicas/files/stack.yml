services:
  web:
    image: registry:5000/lab/webapp:1.0
    environment:
      APP_NAME: web
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      replicas: 3
