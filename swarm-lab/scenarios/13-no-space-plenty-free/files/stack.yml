services:
  web:
    image: registry:5000/lab/webapp:1.0
    environment:
      APP_NAME: web
      SESSION_DIR: /sessions
      SESSION_SNAPSHOT: "5000"
    volumes:
      - sessions:/sessions
    ports:
      - "8080:8000"
    deploy:
      replicas: 1

volumes:
  sessions:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=256m,nr_inodes=4096"
